<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project Java | Smart Attendance</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- Admin Join Button -->
<button
    type="button"
    onclick="window.location.href='admin-join.html'"
    style="
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        z-index: 9999;
    "
>
    🔑 Join as Admin
</button>

    <!-- Animated Background -->

    <div class="background">

        <div class="wave wave1"></div>
        <div class="wave wave2"></div>
        <div class="wave wave3"></div>

        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>

    </div>


    <!-- Login Container -->

    <main class="login-container">

        <section class="brand-section">

            <div class="logo">
                SA
            </div>

            <h1>
                Smart Attendance
            </h1>

            <p>
                Secure • Smart • Simple
            </p>

            <div class="brand-line"></div>

            <span>
                Project Java
            </span>

        </section>


        <section class="login-card">

            <div class="card-header">

                <h2>Welcome Back</h2>

                <p>
                    Login to continue
                </p>

            </div>


            <!-- Login Type -->

            <div class="login-type">

                <button
                    type="button"
                    class="type-btn active"
                    id="studentBtn"
                    onclick="selectLoginType('student')"
                >
                    Student
                </button>

                <button
                    type="button"
                    class="type-btn"
                    id="adminBtn"
                    onclick="selectLoginType('admin')"
                >
                    Admin
                </button>

            </div>


            <!-- Login Form -->

            <form id="loginForm">

                <input
                    type="hidden"
                    id="loginType"
                    value="student"
                >


                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>Remember me</span>

                    </label>

                    <a
    href="forgot-password.html"
>
    Forgot Password?
</a>
                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    <span>Login</span>
                    <span class="arrow">→</span>
                </button>


                <div
                    id="message"
                    class="message"
                ></div>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>

</html>
