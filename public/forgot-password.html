<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Project Java</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #172554
                );

            color: white;

            padding: 20px;

        }

        .container {

            width: 100%;

            max-width: 430px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid rgba(255,255,255,0.15);

            border-radius: 22px;

            padding: 35px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.45);

        }

        .logo {

            text-align: center;

            margin-bottom: 25px;

        }

        .logo h1 {

            font-size: 30px;

            letter-spacing: 2px;

            color: #38bdf8;

        }

        .logo p {

            margin-top: 6px;

            color: #cbd5e1;

            font-size: 14px;

        }

        h2 {

            text-align: center;

            margin-bottom: 10px;

        }

        .subtitle {

            text-align: center;

            color: #94a3b8;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 25px;

        }

        .form-group {

            margin-bottom: 18px;

        }

        label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            color: #e2e8f0;

        }

        input {

            width: 100%;

            padding: 13px 14px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            outline: none;

            background:
                rgba(15,23,42,0.8);

            color: white;

            font-size: 15px;

        }

        input:focus {

            border-color: #38bdf8;

            box-shadow:
                0 0 0 3px
                rgba(56,189,248,0.12);

        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #0284c7,
                    #2563eb
                );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }

        button:hover {

            transform: translateY(-1px);

            box-shadow:
                0 8px 25px
                rgba(37,99,235,0.35);

        }

        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;

        }

        .hidden {

            display: none;

        }

        .message {

            margin-top: 18px;

            padding: 12px;

            border-radius: 9px;

            font-size: 14px;

            text-align: center;

            display: none;

        }

        .success {

            display: block;

            background:
                rgba(34,197,94,0.15);

            color: #86efac;

            border:
                1px solid
                rgba(34,197,94,0.3);

        }

        .error {

            display: block;

            background:
                rgba(239,68,68,0.15);

            color: #fca5a5;

            border:
                1px solid
                rgba(239,68,68,0.3);

        }

        .back {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #38bdf8;

            text-decoration: none;

            font-size: 14px;

        }

        .back:hover {

            text-decoration: underline;

        }

        .step {

            margin-bottom: 18px;

            padding: 10px 14px;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.05);

            color: #cbd5e1;

            font-size: 13px;

        }

        @media (max-width: 480px) {

            .container {

                padding: 25px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">

        <h1>PROJECT JAVA</h1>

        <p>Smart Examination System</p>

    </div>


    <h2>Forgot Password?</h2>

    <p class="subtitle">

        Reset your student account password using an OTP sent to your email.

    </p>


    <!-- STEP 1 -->

    <div id="emailStep">

        <div class="step">

            Step 1 of 3 — Enter your registered email

        </div>

        <div class="form-group">

            <label for="email">
                Student Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                autocomplete="email"
            >

        </div>

        <button
            type="button"
            id="sendOtpBtn"
            onclick="sendOtp()"
        >
            Send OTP
        </button>

    </div>


    <!-- STEP 2 -->

    <div
        id="otpStep"
        class="hidden"
    >

        <div class="step">

            Step 2 of 3 — Verify your OTP

        </div>

        <div class="form-group">

            <label for="otp">
                6-Digit OTP
            </label>

            <input
                type="text"
                id="otp"
                maxlength="6"
                inputmode="numeric"
                placeholder="Enter OTP"
            >

        </div>

        <button
            type="button"
            id="verifyOtpBtn"
            onclick="verifyOtp()"
        >
            Verify OTP
        </button>

    </div>


    <!-- STEP 3 -->

    <div
        id="passwordStep"
        class="hidden"
    >

        <div class="step">

            Step 3 of 3 — Create a new password

        </div>

        <div class="form-group">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
            >

        </div>

        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter new password"
            >

        </div>

        <button
            type="button"
            id="resetBtn"
            onclick="resetPassword()"
        >
            Reset Password
        </button>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to Login
    </a>


</div>


<script>

    let userEmail = "";

    let otpVerified = false;


    function showMessage(
        message,
        type
    ) {

        const box =
            document.getElementById(
                "message"
            );

        box.textContent = message;

        box.className =
            "message " + type;

    }


    async function sendOtp() {

        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();

        if (!email) {

            showMessage(
                "Please enter your email.",
                "error"
            );

            return;

        }

        const button =
            document.getElementById(
                "sendOtpBtn"
            );

        button.disabled = true;

        button.textContent =
            "Sending OTP...";


        try {

            const response =
                await fetch(
                    "/api/forgot-password/send-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Unable to send OTP.",
                    "error"
                );

                return;

            }


            userEmail = email;


            document
                .getElementById("emailStep")
                .classList
                .add("hidden");


            document
                .getElementById("otpStep")
                .classList
                .remove("hidden");


            showMessage(
                "OTP sent successfully. Check your email.",
                "success"
            );


        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to the server.",
                "error"
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Send OTP";

        }

    }


    async function verifyOtp() {

        const otp =
            document
                .getElementById("otp")
                .value
                .trim();


        if (!/^\d{6}$/.test(otp)) {

            showMessage(
                "Please enter a valid 6-digit OTP.",
                "error"
            );

            return;

        }


        const button =
            document.getElementById(
                "verifyOtpBtn"
            );

        button.disabled = true;

        button.textContent =
            "Verifying...";


        try {

            const response =
                await fetch(
                    "/api/forgot-password/verify-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: userEmail,
                            otp: otp
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Invalid OTP.",
                    "error"
                );

                return;

            }


            otpVerified = true;


            document
                .getElementById("otpStep")
                .classList
                .add("hidden");


            document
                .getElementById("passwordStep")
                .classList
                .remove("hidden");


            showMessage(
                "OTP verified. Create your new password.",
                "success"
            );


        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to the server.",
                "error"
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Verify OTP";

        }

    }


    async function resetPassword() {

        if (!otpVerified) {

            showMessage(
                "Please verify the OTP first.",
                "error"
            );

            return;

        }


        const password =
            document
                .getElementById("newPassword")
                .value;

        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;

        }


        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }


        const button =
            document.getElementById(
                "resetBtn"
            );

        button.disabled = true;

        button.textContent =
            "Resetting...";


        try {

            const response =
                await fetch(
                    "/api/forgot-password/reset",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: userEmail,
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Unable to reset password.",
                    "error"
                );

                return;

            }


            showMessage(
                "Password reset successfully. Redirecting to login...",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "index.html";

                },
                1500
            );


        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to the server.",
                "error"
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Reset Password";

        }

    }

</script>


</body>

</html>
