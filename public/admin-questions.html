
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Questions - Project Java</title>

    <style>
/* =====================================================
   PROJECT JAVA - ADMIN QUESTIONS
   Dark Glass + Cyan Professional Theme
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;

    color: #eaf9ff;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(0, 212, 255, 0.13),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(0, 119, 182, 0.14),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #050b14 0%,
            #08111f 45%,
            #0b2035 100%
        );

    background-size: 180% 180%;

    animation:
        backgroundMove 18s ease infinite;

    overflow-x: hidden;
}


/* =====================================================
   ANIMATED BACKGROUND
===================================================== */

body::before,
body::after {
    content: "";

    position: fixed;

    width: 330px;
    height: 330px;

    border-radius: 50%;

    pointer-events: none;

    z-index: -1;

    filter: blur(45px);
}

body::before {
    top: -170px;
    left: -120px;

    background:
        rgba(0, 212, 255, 0.09);

    animation:
        floatingGlowOne 9s ease-in-out infinite;
}

body::after {
    right: -160px;
    bottom: -160px;

    background:
        rgba(0, 119, 182, 0.11);

    animation:
        floatingGlowTwo 11s ease-in-out infinite;
}

@keyframes backgroundMove {

    0%,
    100% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }
}

@keyframes floatingGlowOne {

    0%,
    100% {
        transform:
            translate(0, 0)
            scale(1);
    }

    50% {
        transform:
            translate(35px, 25px)
            scale(1.08);
    }
}

@keyframes floatingGlowTwo {

    0%,
    100% {
        transform:
            translate(0, 0)
            scale(1);
    }

    50% {
        transform:
            translate(-35px, -25px)
            scale(1.08);
    }
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {
    position: relative;

    width: 100%;

    padding: 20px 4%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    background:
        linear-gradient(
            135deg,
            rgba(7, 22, 36, 0.95),
            rgba(5, 15, 27, 0.90)
        );

    border-bottom:
        1px solid
        rgba(0, 212, 255, 0.12);

    box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.25);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    animation:
        headerAppear 0.7s ease both;
}

.topbar::after {
    content: "";

    position: absolute;

    bottom: 0;
    left: 7%;

    width: 86%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00d4ff,
            #0077b6,
            transparent
        );

    opacity: 0.65;
}

@keyframes headerAppear {

    from {
        opacity: 0;
        transform: translateY(-20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.topbar h1 {
    font-size: 23px;

    letter-spacing: 1px;

    color: #f2fcff;

    text-shadow:
        0 0 18px
        rgba(0, 212, 255, 0.18);
}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-btn {
    border:
        1px solid
        rgba(0, 212, 255, 0.15);

    background:
        rgba(0, 180, 216, 0.08);

    color: #bcefff;

    padding: 10px 17px;

    border-radius: 9px;

    cursor: pointer;

    font-size: 12px;

    font-weight: 600;

    transition:
        transform 0.22s ease,
        background 0.22s ease,
        border-color 0.22s ease,
        box-shadow 0.22s ease;
}

.back-btn:hover {
    background:
        rgba(0, 180, 216, 0.16);

    border-color:
        rgba(0, 212, 255, 0.35);

    color: white;

    transform:
        translateX(-3px);

    box-shadow:
        0 8px 22px
        rgba(0, 180, 216, 0.12);
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container {
    width: 92%;

    max-width: 1100px;

    margin: 32px auto 70px;

    animation:
        pageAppear 0.8s ease both;
}

@keyframes pageAppear {

    from {
        opacity: 0;
        transform: translateY(22px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =====================================================
   COMMON GLASS BOXES
===================================================== */

.exam-info,
.add-question-box,
.questions-box {
    position: relative;

    padding: 25px;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.075),
            rgba(255, 255, 255, 0.025)
        );

    border:
        1px solid
        rgba(255, 255, 255, 0.08);

    box-shadow:
        0 18px 45px
        rgba(0, 0, 0, 0.20);

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    margin-bottom: 25px;

    overflow: hidden;
}

.exam-info::before,
.add-question-box::before,
.questions-box::before {
    content: "";

    position: absolute;

    top: 0;
    left: 7%;

    width: 86%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00d4ff,
            #0077b6,
            transparent
        );

    opacity: 0.55;
}


/* =====================================================
   EXAM INFORMATION
===================================================== */

.exam-info h2 {
    color: #effaff;

    font-size: 25px;

    margin-bottom: 8px;

    line-height: 1.35;
}

.exam-info p {
    color: #7895a5;

    font-size: 13px;
}


/* =====================================================
   PROGRESS BOX
===================================================== */

.progress-box {
    margin-top: 19px;

    padding: 15px;

    border-radius: 11px;

    background:
        rgba(0, 180, 216, 0.055);

    border:
        1px solid
        rgba(0, 212, 255, 0.10);

    color: #9eeaff;

    font-size: 12px;

    font-weight: 700;
}

.progress-bar {
    width: 100%;

    height: 10px;

    margin-top: 10px;

    background:
        rgba(0, 0, 0, 0.30);

    border:
        1px solid
        rgba(255, 255, 255, 0.05);

    border-radius: 10px;

    overflow: hidden;
}

.progress-fill {
    height: 100%;

    width: 0%;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #0077b6,
            #00d4ff
        );

    box-shadow:
        0 0 15px
        rgba(0, 212, 255, 0.35);

    transition:
        width 0.4s ease;
}


/* =====================================================
   ADD QUESTION TITLE
===================================================== */

.add-question-box h2,
.questions-box h2 {
    color: #effaff;

    font-size: 21px;

    letter-spacing: 0.2px;
}


/* =====================================================
   FORM GROUP
===================================================== */

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;

    color: #b9d5df;

    font-size: 12px;

    font-weight: 650;

    margin-bottom: 7px;
}


/* =====================================================
   INPUT / TEXTAREA / SELECT
===================================================== */

textarea,
input,
select {
    width: 100%;

    padding: 12px 13px;

    border:
        1px solid
        rgba(255, 255, 255, 0.10);

    border-radius: 9px;

    outline: none;

    background:
        rgba(0, 0, 0, 0.25);

    color: #eaf9ff;

    font-size: 13px;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

textarea::placeholder,
input::placeholder {
    color: #526d79;
}

textarea:hover,
input:hover,
select:hover {
    border-color:
        rgba(0, 212, 255, 0.16);
}

textarea:focus,
input:focus,
select:focus {
    border-color:
        rgba(0, 212, 255, 0.45);

    background:
        rgba(0, 180, 216, 0.035);

    box-shadow:
        0 0 0 3px
        rgba(0, 212, 255, 0.08),

        0 0 20px
        rgba(0, 180, 216, 0.05);
}

textarea {
    min-height: 115px;

    resize: vertical;

    line-height: 1.55;
}


/* =====================================================
   SELECT
===================================================== */

select {
    cursor: pointer;

    appearance: auto;
}

select option {
    background: #0b1b2a;

    color: #eaf9ff;
}


/* =====================================================
   DISABLED MARKS INPUT
===================================================== */

input:disabled {
    cursor: not-allowed;

    opacity: 0.65;

    background:
        rgba(255, 255, 255, 0.035);

    color: #91a9b4;
}


/* =====================================================
   OPTIONS GRID
===================================================== */

.options-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 15px;
}

.option-label {
    color: #75dff7 !important;
}


/* =====================================================
   ADD QUESTION BUTTON
===================================================== */

.add-btn {
    border:
        1px solid
        rgba(0, 212, 255, 0.20);

    background:
        linear-gradient(
            135deg,
            rgba(0, 180, 216, 0.30),
            rgba(0, 119, 182, 0.22)
        );

    color: #eaffff;

    padding: 12px 21px;

    border-radius: 9px;

    cursor: pointer;

    font-size: 12px;

    font-weight: 700;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.add-btn:hover {
    border-color:
        rgba(0, 212, 255, 0.40);

    background:
        linear-gradient(
            135deg,
            rgba(0, 180, 216, 0.40),
            rgba(0, 119, 182, 0.30)
        );

    box-shadow:
        0 9px 25px
        rgba(0, 180, 216, 0.12);

    transform:
        translateY(-2px);
}

.add-btn:active {
    transform:
        translateY(0)
        scale(0.98);
}

.add-btn:disabled {
    background:
        rgba(255, 255, 255, 0.06);

    border-color:
        rgba(255, 255, 255, 0.07);

    color: #627984;

    cursor: not-allowed;

    box-shadow: none;

    transform: none;
}


/* =====================================================
   MESSAGE
===================================================== */

.message {
    margin-top: 15px;

    padding: 10px 12px;

    border-radius: 8px;

    font-size: 12px;

    color: #7ee5ff;

    line-height: 1.4;
}


/* =====================================================
   COMPLETE MESSAGE
===================================================== */

.complete-message {
    display: none;

    margin-top: 17px;

    padding: 15px;

    border-radius: 10px;

    background:
        rgba(34, 197, 94, 0.08);

    border:
        1px solid
        rgba(34, 197, 94, 0.15);

    color: #78e4a0;

    font-size: 13px;

    font-weight: 700;

    box-shadow:
        0 8px 22px
        rgba(34, 197, 94, 0.04);
}


/* =====================================================
   QUESTION CARDS
===================================================== */

.question-card {
    position: relative;

    padding: 21px;

    margin-bottom: 18px;

    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.055),
            rgba(255, 255, 255, 0.018)
        );

    border:
        1px solid
        rgba(255, 255, 255, 0.07);

    box-shadow:
        0 12px 30px
        rgba(0, 0, 0, 0.15);

    overflow: hidden;

    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;

    animation:
        questionAppear 0.45s ease both;
}

.question-card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 5%;

    width: 90%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00d4ff,
            transparent
        );

    opacity: 0.30;
}

.question-card:hover {
    transform:
        translateY(-4px);

    border-color:
        rgba(0, 212, 255, 0.16);

    box-shadow:
        0 18px 38px
        rgba(0, 0, 0, 0.23),

        0 0 22px
        rgba(0, 180, 216, 0.04);
}

.question-card:hover::before {
    opacity: 0.75;
}

@keyframes questionAppear {

    from {
        opacity: 0;
        transform:
            translateY(12px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}


/* =====================================================
   QUESTION NUMBER
===================================================== */

.question-number {
    display: inline-block;

    color: #5de1ff;

    background:
        rgba(0, 180, 216, 0.08);

    border:
        1px solid
        rgba(0, 212, 255, 0.12);

    padding: 5px 9px;

    border-radius: 6px;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 0.5px;

    margin-bottom: 12px;
}


/* =====================================================
   QUESTION TEXT
===================================================== */

.question-text {
    color: #effaff;

    font-size: 16px;

    font-weight: 650;

    margin-bottom: 16px;

    line-height: 1.55;

    white-space: pre-wrap;
}


/* =====================================================
   OPTIONS
===================================================== */

.option {
    position: relative;

    background:
        rgba(0, 0, 0, 0.20);

    border:
        1px solid
        rgba(255, 255, 255, 0.055);

    color: #a9c0ca;

    padding: 10px 12px;

    border-radius: 8px;

    margin-bottom: 8px;

    font-size: 12px;

    line-height: 1.45;

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
}

.option:hover {
    background:
        rgba(0, 180, 216, 0.055);

    border-color:
        rgba(0, 212, 255, 0.10);

    transform:
        translateX(3px);
}


/* =====================================================
   CORRECT ANSWER
===================================================== */

.correct-answer {
    margin-top: 13px;

    padding: 9px 11px;

    border-radius: 8px;

    background:
        rgba(34, 197, 94, 0.07);

    border:
        1px solid
        rgba(34, 197, 94, 0.12);

    color: #78e4a0;

    font-size: 12px;

    font-weight: 700;
}


/* =====================================================
   DELETE BUTTON
===================================================== */

.delete-btn {
    margin-top: 15px;

    border:
        1px solid
        rgba(239, 68, 68, 0.14);

    background:
        rgba(239, 68, 68, 0.07);

    color: #f39a9a;

    padding: 9px 15px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 11px;

    font-weight: 700;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.delete-btn:hover {
    background:
        rgba(239, 68, 68, 0.15);

    border-color:
        rgba(239, 68, 68, 0.28);

    color: #ffb0b0;

    box-shadow:
        0 7px 18px
        rgba(239, 68, 68, 0.08);

    transform:
        translateY(-2px);
}

.delete-btn:active {
    transform:
        translateY(0)
        scale(0.97);
}


/* =====================================================
   NO QUESTIONS
===================================================== */

.no-questions {
    padding: 30px 15px;

    text-align: center;

    color: #7895a5;

    font-size: 13px;

    border:
        1px dashed
        rgba(255, 255, 255, 0.10);

    border-radius: 11px;

    background:
        rgba(255, 255, 255, 0.018);
}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: #050d17;
}

::-webkit-scrollbar-thumb {
    background:
        linear-gradient(
            180deg,
            #008db8,
            #005779
        );

    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #00a9d4;
}


/* =====================================================
   FOCUS
===================================================== */

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
    outline:
        2px solid
        #4dd9f5;

    outline-offset: 3px;
}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 850px) {

    .options-grid {
        grid-template-columns: 1fr;
    }

    .container {
        width: 94%;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .topbar {
        padding: 16px 5%;

        gap: 15px;
    }

    .topbar h1 {
        font-size: 18px;
    }

    .back-btn {
        padding: 9px 12px;

        font-size: 11px;
    }

    .container {
        width: 94%;

        margin-top: 22px;
    }

    .exam-info,
    .add-question-box,
    .questions-box {
        padding: 20px;

        border-radius: 15px;
    }

    .exam-info h2 {
        font-size: 21px;
    }

    .question-text {
        font-size: 15px;
    }

    .add-btn {
        width: 100%;
    }
}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 480px) {

    .topbar {
        flex-direction: column;

        align-items: stretch;
    }

    .back-btn {
        width: 100%;
    }

    .exam-info,
    .add-question-box,
    .questions-box {
        padding: 17px;
    }

    .progress-box {
        padding: 13px;
    }

    .question-card {
        padding: 17px;
    }

    .question-text {
        font-size: 14px;
    }

    .option {
        font-size: 11px;
    }

    .delete-btn {
        width: 100%;
    }
}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;

        animation-iteration-count: 1 !important;

        transition-duration: 0.01ms !important;

        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

    <div class="topbar">

        <h1>Project Java - Manage Questions</h1>

        <button
            class="back-btn"
            type="button"
            onclick="goBack()"
        >
            ← Back to Exams
        </button>

    </div>


    <div class="container">

        <!-- EXAM INFORMATION -->

        <div class="exam-info">

            <h2 id="examTitle">
                Loading exam...
            </h2>

            <p id="examDetails">
                Loading exam information...
            </p>

            <div class="progress-box">

                <div id="progressText">
                    Questions added: 0 / 10
                </div>

                <div class="progress-bar">

                    <div
                        id="progressFill"
                        class="progress-fill"
                    ></div>

                </div>

            </div>

        </div>


        <!-- ADD QUESTION -->

        <div
            id="addQuestionBox"
            class="add-question-box"
        >

            <h2 id="questionNumberTitle">
                Add Question 1 of 10
            </h2>

            <br>

            <form id="questionForm">

                <!-- QUESTION -->

                <div class="form-group">

                    <label for="questionText">
                        Question
                    </label>

                    <textarea
                        id="questionText"
                        placeholder="Write your question here..."
                        required
                    ></textarea>

                </div>


                <!-- OPTIONS -->

                <div class="options-grid">

                    <div class="form-group">

                        <label
                            class="option-label"
                            for="option1"
                        >
                            Option 1
                        </label>

                        <input
                            type="text"
                            id="option1"
                            placeholder="Write option 1"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label
                            class="option-label"
                            for="option2"
                        >
                            Option 2
                        </label>

                        <input
                            type="text"
                            id="option2"
                            placeholder="Write option 2"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label
                            class="option-label"
                            for="option3"
                        >
                            Option 3
                        </label>

                        <input
                            type="text"
                            id="option3"
                            placeholder="Write option 3"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label
                            class="option-label"
                            for="option4"
                        >
                            Option 4
                        </label>

                        <input
                            type="text"
                            id="option4"
                            placeholder="Write option 4"
                            required
                        >

                    </div>

                </div>


                <!-- CORRECT ANSWER -->

                <div class="form-group">

                    <label for="correctOption">
                        Correct Answer
                    </label>

                    <select
                        id="correctOption"
                        required
                    >

                        <option value="">
                            Select the correct option
                        </option>

                        <option value="1">
                            Option 1
                        </option>

                        <option value="2">
                            Option 2
                        </option>

                        <option value="3">
                            Option 3
                        </option>

                        <option value="4">
                            Option 4
                        </option>

                    </select>

                </div>


                <!-- MARKS -->

                <div class="form-group">

                    <label>
                        Marks
                    </label>

                    <input
                        type="text"
                        value="1 mark"
                        disabled
                    >

                </div>


                <button
                    id="addQuestionBtn"
                    type="submit"
                    class="add-btn"
                >
                    + Add Question
                </button>

                <div
                    id="message"
                    class="message"
                ></div>

            </form>


            <div
                id="completeMessage"
                class="complete-message"
            >
                All required questions have been added.
                You can now publish this exam.
            </div>

        </div>


        <!-- EXISTING QUESTIONS -->

        <div class="questions-box">

            <h2>Questions in this Exam</h2>

            <br>

            <div id="questionsContainer">

                <p class="no-questions">
                    Loading questions...
                </p>

            </div>

        </div>

    </div>


<script>

    // =========================================
    // GET EXAM ID
    // =========================================

    const urlParams =
        new URLSearchParams(
            window.location.search
        );

    const examId =
        urlParams.get("examId");


    // =========================================
    // VARIABLES
    // =========================================

    let totalMarks = 0;
    let questionCount = 0;


    // =========================================
    // CHECK EXAM ID
    // =========================================

    if (!examId) {

        alert("Exam ID is missing.");

        window.location.href =
            "admin-dashboard.html";

    }


    // =========================================
    // LOAD EXAM
    // =========================================

    async function loadExam() {

        try {

            const response =
                await fetch(
                    `/api/admin-exams/${examId}`
                );

            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                document.getElementById(
                    "examTitle"
                ).textContent =
                    "Unable to load exam.";

                return;

            }


            totalMarks =
                Number(
                    data.exam.total_marks
                );


            document.getElementById(
                "examTitle"
            ).textContent =
                data.exam.exam_title;


            document.getElementById(
                "examDetails"
            ).textContent =
                `${data.exam.subject_code} • ` +
                `${data.exam.duration_minutes} minutes • ` +
                `${totalMarks} marks`;


            updateQuestionUI();

        }

        catch (error) {

            console.error(
                "Load exam error:",
                error
            );

        }

    }


    // =========================================
    // LOAD QUESTIONS
    // =========================================

    async function loadQuestions() {

        const container =
            document.getElementById(
                "questionsContainer"
            );


        try {

            const response =
                await fetch(
                    `/api/admin-questions?examId=${examId}`
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                container.innerHTML =
                    "<p>Unable to load questions.</p>";

                return;

            }


            questionCount =
                data.questions.length;


            updateQuestionUI();


            if (
                !data.questions ||
                data.questions.length === 0
            ) {

                container.innerHTML =
                    `<p class="no-questions">
                        No questions added yet.
                    </p>`;

                return;

            }


            container.innerHTML = "";


            data.questions.forEach(
                function(question, index) {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "question-card";


                    card.innerHTML = `

                        <div class="question-number">
                            Question ${index + 1}
                        </div>

                        <div class="question-text">
                            ${question.question_text}
                        </div>

                        <div class="option">
                            1. ${question.option_a}
                        </div>

                        <div class="option">
                            2. ${question.option_b}
                        </div>

                        <div class="option">
                            3. ${question.option_c}
                        </div>

                        <div class="option">
                            4. ${question.option_d}
                        </div>

                        <div class="correct-answer">
                            Correct Answer:
                            Option ${question.correct_option}
                        </div>

                        <button
                            class="delete-btn"
                            type="button"
                            onclick="deleteQuestion(${question.id})"
                        >
                            Delete
                        </button>

                    `;


                    container.appendChild(card);

                }
            );

        }

        catch (error) {

            console.error(
                "Load questions error:",
                error
            );


            container.innerHTML =
                "<p>Unable to connect to server.</p>";

        }

    }


    // =========================================
    // UPDATE QUESTION UI
    // =========================================

    function updateQuestionUI() {

        const progressText =
            document.getElementById(
                "progressText"
            );

        const progressFill =
            document.getElementById(
                "progressFill"
            );

        const title =
            document.getElementById(
                "questionNumberTitle"
            );

        const addButton =
            document.getElementById(
                "addQuestionBtn"
            );

        const addBox =
            document.getElementById(
                "addQuestionBox"
            );

        const completeMessage =
            document.getElementById(
                "completeMessage"
            );


        const safeTotal =
            totalMarks > 0
                ? totalMarks
                : 10;


        progressText.textContent =
            `Questions added: ${questionCount} / ${safeTotal}`;


        const percentage =
            Math.min(
                100,
                (questionCount / safeTotal) * 100
            );


        progressFill.style.width =
            `${percentage}%`;


        if (questionCount >= safeTotal) {

            title.textContent =
                "All Questions Added";

            addButton.disabled = true;

            addBox.querySelector(
                "form"
            ).style.display = "none";

            completeMessage.style.display =
                "block";

            return;

        }


        title.textContent =
            `Add Question ${questionCount + 1} of ${safeTotal}`;

        addButton.disabled = false;

        addBox.querySelector(
            "form"
        ).style.display = "block";

        completeMessage.style.display =
            "none";

    }


    // =========================================
    // ADD QUESTION
    // =========================================

    document
        .getElementById("questionForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                if (
                    questionCount >= totalMarks
                ) {

                    return;

                }


                const message =
                    document.getElementById(
                        "message"
                    );


                message.textContent =
                    "Adding question...";


                const questionData = {

                    examId: examId,

                    questionText:
                        document.getElementById(
                            "questionText"
                        ).value.trim(),

                    optionA:
                        document.getElementById(
                            "option1"
                        ).value.trim(),

                    optionB:
                        document.getElementById(
                            "option2"
                        ).value.trim(),

                    optionC:
                        document.getElementById(
                            "option3"
                        ).value.trim(),

                    optionD:
                        document.getElementById(
                            "option4"
                        ).value.trim(),

                    correctOption:
                        document.getElementById(
                            "correctOption"
                        ).value,

                    marks: 1

                };


                try {

                    const response =
                        await fetch(
                            "/api/admin-questions",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        questionData
                                    )
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        message.textContent =
                            data.message ||
                            "Unable to add question.";

                        return;

                    }


                    message.textContent =
                        "Question added successfully.";


                    document
                        .getElementById(
                            "questionForm"
                        )
                        .reset();


                    await loadQuestions();

                }

                catch (error) {

                    console.error(
                        "Add question error:",
                        error
                    );


                    message.textContent =
                        "Unable to connect to server.";

                }

            }
        );


    // =========================================
    // DELETE QUESTION
    // =========================================

    async function deleteQuestion(questionId) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this question?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    `/api/admin-questions/${questionId}`,
                    {
                        method: "DELETE"
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                alert(
                    data.message ||
                    "Unable to delete question."
                );

                return;

            }


            loadQuestions();

        }

        catch (error) {

            console.error(
                "Delete question error:",
                error
            );


            alert(
                "Unable to connect to server."
            );

        }

    }


    // =========================================
    // BACK TO EXAMS
    // =========================================

    function goBack() {

        window.location.href =
            "admin-exams.html?subjectId=1";

    }


    // =========================================
    // INITIAL LOAD
    // =========================================

    loadExam();

    loadQuestions();

</script>

</body>
</html>
'''
